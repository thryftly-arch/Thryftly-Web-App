<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all — THRYFTLY</title>
  <meta name="description" content="Every THRYFTLY piece in one place: hoodies, tees, sweatshirts and more.">
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-page="shop">
  <header class="nav" data-chrome></header>
  <main class="page">
    <div class="page-head">
      <h1 class="page-h1">SHOP <span class="volt">ALL.</span></h1>
      <span class="sec-meta shop-count"></span>
    </div>
    <div class="shop-bar">
      <div class="chips" role="tablist" aria-label="Category"></div>
      <div class="shop-tools">
        <input class="shop-search" type="search" placeholder="Search" aria-label="Search products">
        <select class="shop-sort" aria-label="Sort">
          <option value="featured">FEATURED</option>
          <option value="rated">TOP RATED</option>
          <option value="az">A → Z</option>
          <option value="low">PRICE: LOW → HIGH</option>
          <option value="high">PRICE: HIGH → LOW</option>
        </select>
      </div>
    </div>
    <div class="filters">
      <button type="button" class="filter-toggle btn-ghost" aria-expanded="false">FILTER <span class="filter-n"></span></button>
      <div class="filter-body">
        <div class="filter-group"><span class="sizes-label">SIZE</span><div class="fchips f-size"></div></div>
        <div class="filter-group"><span class="sizes-label">COLOUR</span><div class="fchips f-color"></div></div>
        <div class="filter-group"><span class="sizes-label">PRICE</span><div class="fchips f-price"></div></div>
        <label class="f-stock"><input type="checkbox" class="f-instock"> IN STOCK ONLY</label>
        <button type="button" class="acct-link f-clear">CLEAR ALL</button>
      </div>
    </div>
    <section class="shop-grid"></section>
    <p class="shop-empty" hidden>NOTHING MATCHES. TRY ANOTHER SEARCH.</p>
  </main>

  <footer class="footer" data-chrome></footer>
  <script type="module" src="/src/pages.js"></script>
</body>
</html>
