<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — THRYFTLY</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="nav" data-chrome></header>

  <main class="co">
    <section>
      <h1 class="co-h1">YOUR <span class="volt">CART.</span></h1>
      <div class="co-lines"></div>
    </section>

    <form class="co-form" novalidate>
      <h2>SHIP TO</h2>
      <input name="name" placeholder="Full name" autocomplete="name" required>
      <div class="co-row">
        <input name="email" type="email" placeholder="Email" autocomplete="email" required>
        <input name="phone" type="tel" placeholder="Mobile (10 digits)" autocomplete="tel-national" required>
      </div>
      <input name="address1" placeholder="House / street" autocomplete="address-line1" required>
      <input name="address2" placeholder="Area / landmark (optional)" autocomplete="address-line2">
      <div class="co-row">
        <input name="city" placeholder="City" autocomplete="address-level2" required>
        <input name="state" placeholder="State" autocomplete="address-level1" required>
      </div>
      <input name="zip" inputmode="numeric" placeholder="PIN code" autocomplete="postal-code" required>
      <div class="co-code"><input name="code" placeholder="Discount code" autocomplete="off" aria-label="Discount code"><button type="button" class="btn-ghost co-apply">APPLY</button></div>
      <div class="co-sum"></div>
      <button class="btn-red co-pay" type="submit">PAY NOW →</button>
      <p class="co-msg" aria-live="polite"></p>
    </form>
  </main>

  <footer class="footer" data-chrome></footer>

  <script type="module" src="/src/checkout.js"></script>
</body>
</html>
