<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track order — THRYFTLY</title>
  <meta name="description" content="Track your THRYFTLY order.">
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-page="track">
  <header class="nav" data-chrome></header>
  <main class="page page-split">
    <section>
      <h1 class="page-h1">TRACK <span class="volt">ORDER.</span></h1>
      <p class="prose">Enter the order number from your confirmation and the email you used at checkout.</p>
    </section>
    <form class="co-form track-form">
      <h2>FIND YOUR ORDER</h2>
      <input name="number" placeholder="Order number (e.g. thmx2k…)" required>
      <input name="email" type="email" placeholder="Email" autocomplete="email" required>
      <button class="btn-red" type="submit">TRACK →</button>
      <p class="co-msg" aria-live="polite"></p>
      <div class="track-out"></div>
    </form>
  </main>

  <footer class="footer" data-chrome></footer>
  <script type="module" src="/src/pages.js"></script>
</body>
</html>
