<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THRYFTLY — Streetwear, printed to order</title>
  <meta name="description" content="Oversized tees, hoodies and sweatshirts with bold graphics, printed to order and shipped across India.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="THRYFTLY">
  <meta property="og:title" content="THRYFTLY — Streetwear, printed to order">
  <meta property="og:description" content="Oversized tees, hoodies and sweatshirts with bold graphics, printed to order and shipped across India.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="nav" data-chrome></header>

  <main>
    <section class="hero">
      <div class="hero-floor"></div>
      <div class="hero-outline">THRYFTLY</div>

      <div class="hero-copy d-only">
        <span class="kicker" data-s="kicker"></span>
        <h1 class="hero-h1"><span data-s="heroTitle">WEAR THE</span> <span class="volt" data-s="heroAccent">VOLTAGE.</span></h1>
        <p class="hero-p" data-s="heroText">Rescued vintage, reworked by hand and charged for the street. Every piece is a one-off. When it's gone, it's archived.</p>
        <div class="hero-ctas">
          <a class="btn-red hero-cta" href="#lineup" data-s="ctaLabel"></a>
          <a class="btn-ghost" href="#rotation" data-s="secondaryCta"></a>
        </div>
        <div class="countdown-block" hidden>
          <span class="countdown-label hero-count-label"></span>
          <span class="countdown countdown-lg hero-count"></span>
        </div>
      </div>

      <span class="m-kicker m-only" data-s="mobileKicker"></span>
      <div class="hero-stage"><div class="stage-inner">
        <div class="stage-ring d-only"></div>
        <div class="stage-ring-dash d-only"></div>
        <i class="corner tl d-only"></i><i class="corner tr d-only"></i><i class="corner bl d-only"></i><i class="corner br d-only"></i>
        <span class="stage-spec d-only">OBJ: BOLT<br>ROT: 360°/8S<br>DEPTH: 24MM<br><span class="red">● CHARGED</span></span>
        <div class="bolt-float">
          <div class="bolt3d spin" data-depth="24"></div>
        </div>
      </div></div>
    </section>

    <div class="m-hero-copy m-only">
      <h1 class="hero-h1"><span data-s="heroTitle">WEAR THE</span> <span class="volt" data-s="heroAccent">VOLTAGE.</span></h1>
      <div class="m-countdown" hidden><span class="hero-count-label"></span><span class="countdown hero-count"></span></div>
      <a class="btn-red hero-cta" href="#lineup" data-s="ctaLabel"></a>
    </div>
    <div class="m-strip m-only"></div>

    <div class="marquee">
      <div class="marquee-track"></div>
    </div>

    <div id="drops"></div>

    <section class="rotation" id="rotation" tabindex="-1" aria-roledescription="carousel">
      <div class="sec-head">
        <h2 class="sec-h2" data-s="rotationTitle"></h2>
        <span class="sec-meta">DRAG · SWIPE · ← →</span>
      </div>
      <div class="ring-stage">
        <div class="ring-floor"></div>
        <div class="ring"></div>
      </div>
      <div class="ring-ui">
        <button class="ring-btn ring-prev" aria-label="Previous piece">←</button>
        <div class="ring-info" aria-live="polite">
          <span class="ring-idx"></span>
          <a class="ring-name" href="#"></a>
          <span class="ring-meta"></span>
        </div>
        <button class="ring-btn ring-next" aria-label="Next piece">→</button>
      </div>
    </section>

    <section class="lineup" id="lineup">
      <div class="sec-head">
        <h2 class="sec-h2" data-s="productsTitle"></h2>
        <a class="sec-meta shop-all" href="/shop.html"></a>
      </div>
      <div class="cat-secs"></div>
    </section>
  </main>

  <footer class="footer" data-chrome></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
